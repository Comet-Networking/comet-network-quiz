
id: network-protocols
title: Networking Protocols
questions:
  - id: q1
    prompt: Which protocol automatically assigns IP addresses to devices on a network?
    choices:
      - ARP
      - DHCP
      - DNS
      - ICMP
    correctChoice: 1

  - id: q2
    prompt: What does ARP resolve on a local IPv4 network?
    choices:
      - IP addresses to MAC addresses
      - Domain names to IP addresses
      - Port numbers to applications
      - MAC addresses to domain names
    correctChoice: 0

  - id: q3
    prompt: Which OSI layer uses TCP and UDP?
    choices:
      - Data Link
      - Network
      - Transport
      - Application
    correctChoice: 2

  - id: q4
    prompt: Which message comes first in the DHCP DORA process?
    choices:
      - DHCP Offer
      - DHCP Request
      - DHCP Acknowledge
      - DHCP Discover
    correctChoice: 3

  - id: q5
    prompt: Which subnet mask corresponds to a /24 IPv4 prefix?
    choices:
      - 255.255.0.0
      - 255.255.255.0
      - 255.255.255.128
      - 255.255.255.252
    correctChoice: 1
