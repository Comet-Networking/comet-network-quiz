$schema: https://json-schema.org/draft/2020-12/schema
title: Server-only quiz file
type: object
additionalProperties: false
required:
  - id
  - title
  - questions
properties:
  $schema:
    type: string
  id:
    type: string
    minLength: 1
  title:
    type: string
    minLength: 1
  questions:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required:
        - id
        - prompt
        - choices
        - correctChoice
      properties:
        id:
          type: string
          minLength: 1
        prompt:
          type: string
          minLength: 1
        choices:
          type: array
          minItems: 4
          maxItems: 4
          items:
            type: string
            minLength: 1
        correctChoice:
          type: integer
          minimum: 0
          maximum: 3
